<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>韓単ハングル</title>
<style>
  :root {
    --bg: #FFFFFF; --card: #F3F2EE; --line: #DBD8CF;
    --t1: #1E1A14; --t2: #615748; --t3: #8B8170; --accent: #3A5BB8;
    --cover: #21335F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15130F; --card: #1E1B16; --line: #2F2A23;
      --t1: #EFE9DE; --t2: #A99E8E; --t3: #786D5F; --accent: #7196E8;
      --cover: #A9BEDE;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--t1);
    font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
    line-height: 1.8;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 4rem 1.25rem 5rem; }
  .book {
    position: relative; width: 108px; height: 152px; margin-bottom: 2rem;
    background: var(--cover); border-radius: 3px 10px 10px 3px; overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    display: flex; flex-direction: column; justify-content: center;
    padding-left: 18px; padding-right: 12px;
  }
  .book .rule { width: 24px; height: 2px; background: rgba(0,0,0,.34); }
  @media (prefers-color-scheme: dark) { .book .rule { background: rgba(0,0,0,.34); } }
  .book .name { margin-top: 10px; font-size: 15px; font-weight: 700; line-height: 1.3; color: rgba(0,0,0,.82); }
  .book .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.26); }
  .book .seam  { position: absolute; left: 7px; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.16); }
  .book .edge  { position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: #E8E1D2; }
  h1 { font-size: 1.8rem; margin: 0 0 .4rem; }
  .lead { color: var(--t2); margin: 0 0 2.5rem; }
  ul { margin: 0 0 2.5rem; padding-left: 1.25rem; color: var(--t2); }
  li { margin-bottom: .5rem; }
  a { color: var(--accent); }
  footer { padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--t3); font-size: .9rem; }
  footer a { margin-right: 1rem; }
</style>
</head>
<body>
<main>
  <div class="book">
    <div class="rule"></div>
    <div class="name">韓単<br>ハングル</div>
    <div class="spine"></div><div class="seam"></div><div class="edge"></div>
  </div>

  <h1>韓単ハングル</h1>
  <p class="lead">日本語で韓国語の単語を覚えるアプリ。辞書を同梱しているので、通信なしで使えます。</p>

  <ul>
    <li>ハングル入門から上級まで、用意された単語帳をそのまま使えます</li>
    <li>暗記カード・単語クイズ・書き取り・手書きの4通りで確認できます</li>
    <li>写真から単語を読み取って、意味を辞書で埋められます</li>
    <li>単語帳も学習の記録も端末の中だけに保存されます</li>
  </ul>

  <footer>
    <a href="./privacy.html">プライバシーポリシー</a>
    <a href="./terms.html">利用規約</a>
  </footer>
</main>
</body>
</html>
